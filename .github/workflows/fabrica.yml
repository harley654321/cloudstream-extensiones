name: Fabrica de extensiones

# Al hacer push a main: compila TODAS las extensiones, versiona las que
# cambiaron y publica los .cs3 en compiladas/. Los commits que hace la propia
# fabrica no vuelven a disparar el workflow (GitHub ignora los push hechos con
# GITHUB_TOKEN), ademas de llevar [skip ci].

on:
  push:
    branches: [main]
    paths-ignore:
      - "compiladas/**"
      - ".factory/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: fabrica
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 falla en los runners actuales porque
      # intenta instalar el paquete "tools", que ya no existe en el indice de
      # Google. Instalamos lo justo con sdkmanager directamente.
      - name: Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "${SM:-}" ]; then
            curl -sL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mkdir -p "$SDK/cmdline-tools-manual"
            cp -r /tmp/clt/cmdline-tools "$SDK/cmdline-tools-manual/latest"
            SM="$SDK/cmdline-tools-manual/latest/bin/sdkmanager"
          fi
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK listo en $SDK"

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Versionar extensiones cambiadas
        run: python3 scripts/fabrica.py preparar

      - name: Compilar .cs3 y plugins.json
        run: |
          chmod +x ./gradlew
          ./gradlew make makePluginsJson --no-daemon --stacktrace

      - name: Publicar en compiladas/
        run: python3 scripts/fabrica.py publicar

      - name: Confirmar cambios
        run: |
          git config user.name "Fabrica CloudStream"
          git config user.email "fabrica@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada que publicar"
            exit 0
          fi
          git commit -m "fabrica: compilacion $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push origin HEAD:main
