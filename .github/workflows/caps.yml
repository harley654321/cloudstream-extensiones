name: Portadas con numero

# La web pinta el "Episodio N" con CSS: ese numero no existe dentro de la
# imagen. CloudStream solo muestra una portada por tarjeta, sin capas, asi que
# este workflow compone las imagenes (portada + numero abajo a la derecha) y
# las publica en caps/. La extension lee caps/index.json para saber cuales hay.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/caps.py"
      - ".github/scripts/caps_ms.py"
      - ".github/scripts/caps_mdh.py"
      - ".github/workflows/caps.yml"

permissions:
  contents: write

concurrency:
  group: caps
  cancel-in-progress: false

jobs:
  portadas:
    name: Componer portadas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --quiet --disable-pip-version-check pillow requests

      - name: Generar portadas (AnimeAV1)
        run: python3 .github/scripts/caps.py

      - name: Generar portadas (Monoschinos)
        run: python3 .github/scripts/caps_ms.py

      - name: Generar portadas (Mundo Donghua)
        run: python3 .github/scripts/caps_mdh.py

      - name: Publicar cambios
        run: |
          set -euo pipefail
          git config user.name "fabrica-animeav1"
          git config user.email "fabrica@users.noreply.github.com"
          git add caps
          if git diff --cached --quiet; then
            echo "Sin cambios: las portadas ya estaban al dia."
            exit 0
          fi
          git commit -m "caps: portadas con numero de capitulo [skip ci]"
          git push
